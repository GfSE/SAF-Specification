title: System Architecture Framework
description: A scalable SysML Based Framework to foster MBSE for multiple Modeling Tools!
theme: just-the-docs
source: src
ga_tracking: G-9QKVQ6K2QP
ga_tracking_anonymize_ip: true # Use GDPR compliant Google Analytics settings (true/nil by default)

url: https://saf.gfse.org

logo: "/assets/images/Banner_SAF_gross.png"

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html


plugins:
  - jekyll-relative-links
  - "jekyll-github-metadata"


relative_links:
  enabled:     true

repository: GfSE/SAF-Specification

# Canonical home of this specification. The Pages workflow compares the
# repository it runs in against this value: builds in any other repository
# (forks, copies) automatically render the site with fork notices, while
# builds in the canonical repository (including after a merged pull
# request) render the site without them.
canonical_repository: GfSE/SAF-Specification

callouts:
  note:
    title: Note
    color: blue
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  todo:
    title: ToDo
    color: purple
  warning:
    title: Warning
    color: red
