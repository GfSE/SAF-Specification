<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" font-family="Arial">

  <style>
    .soi { fill:#e6f2ff; stroke:#1a73e8; stroke-width:2; }
    .external { fill:#fff3e0; stroke:#ef6c00; stroke-width:2; }
    .env { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .user { fill:#f3e5f5; stroke:#6a1b9a; stroke-width:2; }
    .text { font-size:14px; text-anchor:middle; dominant-baseline:middle; }
    .line { stroke:#555; stroke-width:1.5; }
  </style>

  <!-- SOI -->
  <rect class="soi" x="350" y="230" width="200" height="100" rx="10"></rect>
  <text class="text" x="450" y="280">FFDS</text>

  <!-- Environments -->
  <rect class="env" x="50" y="100" width="180" height="60" rx="10"></rect>
  <text class="text" x="140" y="130">Fire</text>

  <rect class="env" x="50" y="200" width="180" height="60" rx="10"></rect>
  <text class="text" x="140" y="230">Climate</text>

  <!-- External Systems -->
  <rect class="external" x="670" y="80" width="200" height="60" rx="10"></rect>
  <text class="text" x="770" y="110">Research Analysis System</text>

  <rect class="external" x="670" y="170" width="200" height="60" rx="10"></rect>
  <text class="text" x="770" y="200">Fire Department System</text>

  <rect class="external" x="670" y="260" width="200" height="60" rx="10"></rect>
  <text class="text" x="770" y="290">Satellite System</text>

  <rect class="external" x="670" y="350" width="200" height="60" rx="10"></rect>
  <text class="text" x="770" y="380">Meteorology System</text>

  <!-- Users -->
  <rect class="user" x="350" y="420" width="140" height="50" rx="10"></rect>
  <text class="text" x="420" y="445">Operator</text>

  <rect class="user" x="500" y="420" width="160" height="50" rx="10"></rect>
  <text class="text" x="580" y="445">Administrator</text>

  <rect class="user" x="280" y="420" width="140" height="50" rx="10"></rect>
  <text class="text" x="350" y="445">Maintainer</text>

  <!-- Connections -->
  <!-- Environments -->
  <line class="line" x1="230" y1="130" x2="350" y2="260"></line>
  <line class="line" x1="230" y1="230" x2="350" y2="280"></line>

  <!-- External Systems -->
  <line class="line" x1="670" y1="110" x2="550" y2="260"></line>
  <line class="line" x1="670" y1="200" x2="550" y2="280"></line>
  <line class="line" x1="670" y1="290" x2="550" y2="300"></line>
  <line class="line" x1="670" y1="380" x2="550" y2="320"></line>

  <!-- Users -->
  <line class="line" x1="420" y1="420" x2="450" y2="330"></line>
  <line class="line" x1="580" y1="420" x2="480" y2="330"></line>
  <line class="line" x1="350" y1="420" x2="430" y2="330"></line>

</svg>
